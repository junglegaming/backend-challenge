services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering"]
      interval: 2s
      timeout: 2s
      retries: 30

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\"'"]
      interval: 2s
      timeout: 2s
      retries: 30
