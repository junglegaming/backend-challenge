# `docker compose up --build` sobe tudo: Postgres, LocalStack (SQS), migrations e 3 instâncias da aplicação.
# Para rodar os testes basta a infraestrutura: `docker compose up -d postgres localstack`.
x-app: &app
  build: .
  environment:
    DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    SQS_ENDPOINT: http://localstack:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    command: ["postgres", "-c", "max_connections=200"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering"]
      interval: 2s
      timeout: 2s
      retries: 30

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\"'"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Roda uma vez e sai. As instâncias só sobem depois, então nunca há corrida de migration.
  migrate:
    <<: *app
    command: ["bun", "src/infra/persistence/migrate.ts", "up"]
    depends_on:
      postgres: { condition: service_healthy }

  # Três instâncias idênticas (API + consumidor SQS + workers), em localhost:3000, 3001 e 3002.
  app:
    <<: *app
    deploy:
      replicas: 3
    ports: ["3000-3002:3000"]
    stop_grace_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
