services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 3s
      timeout: 3s
      retries: 10

  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566')\" 2>/dev/null || exit 0"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - .env.example
    environment:
      DATABASE_HOST: postgres
      SQS_ENDPOINT: http://ministack:4566
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules

