name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: >-
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo
          --log-opts=--all --redact --no-banner --config /repo/.gitleaks.toml
      - run: >-
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo
          --redact --no-banner --config /repo/.gitleaks.toml
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:integration
      - run: bun run test:concurrency
