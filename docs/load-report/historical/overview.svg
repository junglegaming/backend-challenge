<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 858" role="img" aria-label="Resumo da única QUICK AWS aceita, com dois FULL excluídos"><title>Resumo da única QUICK AWS aceita, com dois FULL excluídos</title><style>text{font-family:system-ui,sans-serif;fill:var(--chart-text,#18323e)}.paper{fill:var(--chart-bg,#fff)}.grid{stroke:var(--chart-grid,#dce5e9);stroke-width:1}.muted{fill:var(--chart-muted,#526975)}.heading{font-weight:700}.axis{font-size:11px}.small{font-size:13px}</style><rect class="paper" width="100%" height="100%" rx="12"/><text x="36" y="48" font-size="26" class="heading">Carga observada · QUICK diagnóstica AWS</text><text x="36" y="78" font-size="14" class="muted">Uma execução aceita. Nenhum FULL elegível nos dois inputs FULL nominados.</text><rect x="36" y="103" width="352" height="88" rx="10" fill="none" stroke="#93abb6"/><text x="52" y="130" class="small muted">QUICK aceita / nominada</text><text x="52" y="167" font-size="25" class="heading">1 / 1</text><rect x="424" y="103" width="352" height="88" rx="10" fill="none" stroke="#93abb6"/><text x="440" y="130" class="small muted">FULL aceito / nominado</text><text x="440" y="167" font-size="25" class="heading">0 / 2</text><rect x="812" y="103" width="352" height="88" rx="10" fill="none" stroke="#93abb6"/><text x="828" y="130" class="small muted">Respostas HTTP</text><text x="828" y="167" font-size="25" class="heading">1.255</text><text x="36" y="231" font-size="20" class="heading">Latência do cliente · p50 / p95 / p99, ms</text><text x="36" y="255" class="small muted">Resumo k6 da fase inteira; os dois workloads da carga mista oferecem mais tráfego total.</text><text x="36" y="301" class="small">Carteira concentrada / hot</text><rect x="365" y="283" width="145.78333007243967" height="7" rx="2" fill="#087f8c"/><rect x="365" y="293" width="220.06916556987093" height="7" rx="2" fill="#d0712c"/><rect x="365" y="303" width="252.59168511541057" height="7" rx="2" fill="#7656a5"/><text x="890" y="302" class="small">13,165 / 19,873 / 22,81</text><text x="36" y="352" class="small">Carteiras distribuídas / distributed</text><rect x="365" y="334" width="134.70417256923852" height="7" rx="2" fill="#087f8c"/><rect x="365" y="344" width="195.718025084681" height="7" rx="2" fill="#d0712c"/><rect x="365" y="354" width="229.18605060124398" height="7" rx="2" fill="#7656a5"/><text x="890" y="353" class="small">12,164 / 17,674 / 20,696</text><text x="36" y="403" class="small">Replays / distributed</text><rect x="365" y="385" width="127.8657087066215" height="7" rx="2" fill="#087f8c"/><rect x="365" y="395" width="165.12785080324068" height="7" rx="2" fill="#d0712c"/><rect x="365" y="405" width="194.6161446084449" height="7" rx="2" fill="#7656a5"/><text x="890" y="404" class="small">11,547 / 14,911 / 17,574</text><text x="36" y="454" class="small">Replays / replay</text><rect x="365" y="436" width="92.16565611446795" height="7" rx="2" fill="#087f8c"/><rect x="365" y="446" width="136.50814589248543" height="7" rx="2" fill="#d0712c"/><rect x="365" y="456" width="159.241908447129" height="7" rx="2" fill="#7656a5"/><text x="890" y="455" class="small">8,323 / 12,327 / 14,38</text><text x="36" y="505" class="small">Carga mista / hot</text><rect x="365" y="487" width="124.13097036443442" height="7" rx="2" fill="#087f8c"/><rect x="365" y="497" width="205.96805774160438" height="7" rx="2" fill="#d0712c"/><rect x="365" y="507" width="500" height="7" rx="2" fill="#7656a5"/><text x="890" y="506" class="small">11,209 / 18,599 / 45,151</text><text x="36" y="556" class="small">Carga mista / distributed</text><rect x="365" y="538" width="121.84404444247377" height="7" rx="2" fill="#087f8c"/><rect x="365" y="548" width="191.15253403329817" height="7" rx="2" fill="#d0712c"/><rect x="365" y="558" width="455.78843358879635" height="7" rx="2" fill="#7656a5"/><text x="890" y="557" class="small">11,003 / 17,262 / 41,159</text><text x="36" y="623" font-size="20" class="heading">Prova financeira salva e conclusão SQS</text><text x="36" y="654" class="small ">1.001 carteiras reconciliadas · 3.251 transações = entradas no ledger</text><text x="36" y="679" class="small ">6.502 eventos outbox · 0 não publicados · 0 efeitos duplicados · DLQ final 0</text><text x="36" y="704" class="small ">1.000 comandos SQS · envio 167 ms · conclusão 4.585 ms desde o primeiro envio</text><text x="36" y="729" class="small ">Depois do último envio: 4.418 ms · pico amostrado do backlog: 998</text><text x="36" y="754" class="small muted">Sem três FULL AWS, comparação full local/AWS ou ganho de performance demonstrado.</text><text x="36" y="779" class="small muted">CPU/memória, estágios claim/send/confirm e séries durante a drenagem: indisponíveis nesta allowlist.</text><text x="36" y="833" font-size="11" class="muted">Fonte a98d1e6 · loadSourceSha256 36b77c2acde5dc63e35cff9f950c021a8c14601333d87cf590d47de5cc94f161</text></svg>