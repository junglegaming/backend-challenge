global:
  scrape_interval: 5s
  scrape_timeout: 3s

scrape_configs:
  - job_name: wagering
    dns_sd_configs:
      - names: [api, consumer, worker]
        type: A
        port: 3000
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: role
