events {}
http {
  access_log off;
  resolver 127.0.0.11 valid=2s ipv6=off;
  upstream wagering_api {
    zone wagering_api 64k;
    least_conn;
    server api:3000 resolve;
    keepalive 32;
  }
  server {
    listen 3000;
    recursive_error_pages off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_connect_timeout 2s;
    location = /metrics { return 404; }
    location / {
      proxy_pass http://wagering_api;
      # A DNS peer-generation change can exhaust an in-flight upstream selection.
      # A named redirect selects the current generation once; writes never retry here.
      proxy_intercept_errors on;
      error_page 502 = @retry_get;
    }
    location @retry_get {
      if ($request_method != GET) { return 502; }
      proxy_pass http://wagering_api;
    }
  }
}
