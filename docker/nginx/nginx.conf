events {
  # Proxy clients and upstream sockets both count; two load workloads allow 600 clients.
  worker_connections 2048;
}
http {
  log_format upstream_attempts escape=json
    '{"event":"nginx_request_completed","requestId":"$request_id",'
    '"method":"$request_method","status":"$status",'
    '"upstreamAddr":"$upstream_addr","upstreamStatus":"$upstream_status"}';
  access_log /dev/stdout upstream_attempts;
  resolver 127.0.0.11 valid=2s ipv6=off;
  upstream wagering_api {
    zone wagering_api 64k;
    least_conn;
    server api:3000 resolve;
    keepalive 32;
  }
  server {
    listen 3000;
    add_header X-Nginx-Request-Id $request_id always;
    recursive_error_pages off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    # Application 503 responses carry Retry-After and must remain observable;
    # treating them as failed peers can quarantine every healthy API at once.
    proxy_next_upstream error timeout http_502 http_504;
    proxy_connect_timeout 2s;
    location = /metrics { return 404; }
    location / {
      proxy_pass http://wagering_api;
      # A DNS peer-generation change can exhaust an in-flight upstream selection.
      # A named redirect selects the current generation once; writes never retry here.
      proxy_intercept_errors on;
      error_page 502 = @retry_get;
    }
    location @retry_get {
      if ($request_method != GET) { return 502; }
      proxy_pass http://wagering_api;
    }
  }
}
