# Edge reverse proxy / load balancer in front of the app replicas.
# The server block lives in templates/default.conf.template: the official image renders it with envsubst at start
# (only variables defined in the environment are replaced, so nginx's own $variables are left untouched).
worker_processes auto;

events {
  worker_connections 4096;
}

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Docker DNS: one A record per app replica, re-resolved every 5 s (scale up/down without reload).
  resolver 127.0.0.11 valid=5s ipv6=off;

  include /etc/nginx/conf.d/*.conf;
}
