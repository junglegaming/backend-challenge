upstream wagering_app {
    # Docker DNS returns every replica of the "app" service
    server app:3000;
}

server {
    listen 8080;
    location / {
        proxy_pass http://wagering_app;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_next_upstream error timeout;
    }
}
